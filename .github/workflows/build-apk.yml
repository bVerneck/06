name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI & Core
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Initialize Capacitor (if missing)
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init TaskFlow com.taskflow.app --web-dir dist
          fi

      - name: Build web project
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Splash & Icons (if missing)
        run: |
          npx @capacitor/assets generate --android || true

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
